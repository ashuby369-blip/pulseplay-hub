<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PulsePlay Hub</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 14px;
    background: #0b1120;
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .box {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    background: #131c31;
    border: 1px solid #263554;
    border-radius: 16px;
    padding: 18px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .title {
    margin: 0;
    font-size: 22px;
  }
  .badge {
    font-size: 12px;
    background: #1e293b;
    border: 1px solid #334155;
    padding: 5px 10px;
    border-radius: 999px;
    color: #cbd5e1;
  }
  .bal {
    font-size: 26px;
    font-weight: 800;
    color: #facc15;
    margin: 12px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 14px 0;
  }
  .game-card {
    background: #0b1120;
    border: 1px solid #263554;
    border-radius: 12px;
    padding: 14px 12px;
    text-align: left;
    color: #f8fafc;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .game-card.active {
    border-color: #10b981;
    background: #0f2429;
    color: #6ee7b7;
  }
  .game-sub {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: #94a3b8;
    margin-top: 4px;
  }
  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .btn-play {
    flex: 1 1 180px;
    background: #10b981;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-dep {
    flex: 1 1 140px;
    background: #2563eb;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .upi-box {
    margin-top: 14px;
    padding: 14px;
    background: #0b1120;
    border: 1px solid #1e293b;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.55;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="header">
      <h2 class="title">PulsePlay Hub</h2>
      <span class="badge">Starter Credit • 3× / ₹600 Playthrough</span>
    </div>

    <div class="bal" id="balText">Balance: ₹200.00</div>

    <div class="grid" id="gameGrid">
      <button type="button" class="game-card active" data-game="Sky wins">
        Sky wins
        <span class="game-sub">Tap to select</span>
      </button>
      <button type="button" class="game-card" data-game="Crystal Drop">
        Crystal Drop
        <span class="game-sub">Tap to select</span>
      </button>
      <button type="button" class="game-card" data-game="Hue Match">
        Hue Match
        <span class="game-sub">Tap to select</span>
      </button>
      <button type="button" class="game-card" data-game="Spin Blitz">
        Spin Blitz
        <span class="game-sub">Tap to select</span>
      </button>
    </div>

    <div class="actions">
      <button type="button" class="btn-play" id="playBtn">Play Round (-₹20)</button>
      <button type="button" class="btn-dep" id="depBtn">UPI Deposit Info</button>
    </div>

    <div class="upi-box" id="infoBox">
      Selected Game: <strong>Sky wins</strong>. Tap Play Round (-₹20) to test a round.
    </div>
  </div>

<script>
  let bal = 200;
  let selectedGame = "Sky wins";

  const cards = document.querySelectorAll(".game-card");
  const infoBox = document.getElementById("infoBox");
  const balText = document.getElementById("balText");

  cards.forEach(function (card) {
    card.addEventListener("click", function () {
      cards.forEach(function (c) {
        c.classList.remove("active");
      });
      card.classList.add("active");
      selectedGame = card.getAttribute("data-game");
      infoBox.innerHTML = "Selected Game: <strong>" + selectedGame + "</strong>. Ready to play.";
    });
  });

  document.getElementById("playBtn").addEventListener("click", function () {
    if (bal < 20) {
      infoBox.innerHTML = "Low balance. Tap <strong>UPI Deposit Info</strong> for reference details.";
      return;
    }
    bal -= 20;
    const won = Math.random() > 0.5;
    if (won) {
      bal += 40;
    }
    balText.textContent = "Balance: ₹" + bal.toFixed(2);
    infoBox.innerHTML = won
      ? "<strong>" + selectedGame + "</strong>: Won ₹40.00!"
      : "<strong>" + selectedGame + "</strong>: No win this round.";
  });

  document.getElementById("depBtn").addEventListener("click", function () {
    infoBox.innerHTML =
      "UPI ID: <strong>sashu1537@ybl</strong><br>" +
      "Ref: <strong>PulsePlay-Desk-01</strong><br>" +
      "Manual verification required in static mode.";
  });
</script>
</body>
</html>
