<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PulsePlay Hub</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:12px;background:#070b14;color:#f8fafc;font-family:system-ui,sans-serif}
  .card{max-width:460px;margin:0 auto 12px;background:#111827;border:1px solid #26334d;border-radius:14px;padding:14px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .bal{font-size:24px;font-weight:800;color:#facc15}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
  .tab{background:#0b1120;border:1px solid #26334d;color:#cbd5e1;padding:9px 4px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
  .tab.on{border-color:#10b981;color:#6ee7b7;background:#0f2629}
  .stakes{display:flex;gap:6px;margin:10px 0}
  .st{flex:1;background:#0b1120;border:1px solid #26334d;color:#fff;padding:8px;border-radius:8px;font-weight:700;cursor:pointer}
  .st.on{border-color:#facc15;color:#facc15}
  .btn{width:100%;background:#10b981;color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
  .btn.red{background:#ef4444}.btn.blue{background:#2563eb}
  .sky{height:130px;background:#090f1d;border:1px solid #26334d;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .mult{font-size:36px;font-weight:900;color:#facc15}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
  .cell{aspect-ratio:1/1;background:#1e293b;border:1px solid #334155;border-radius:8px;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .hue{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
  .hb{padding:11px 4px;border:2px solid transparent;border-radius:9px;color:#fff;font-weight:700;cursor:pointer}
  .hb.on{border-color:#facc15}
  .box{background:#090f1d;border:1px solid #26334d;border-radius:10px;padding:10px;font-size:13px;margin-top:10px;line-height:1.5}
  .hide{display:none}
  input{width:100%;padding:10px;border-radius:9px;border:1px solid #26334d;background:#090f1d;color:#fff;margin-top:6px}
</style>
</head>
<body>

<div id="loginBox" class="card">
  <h2 style="margin:0 0 6px">PulsePlay Hub</h2>
  <div style="font-size:13px;color:#94a3b8">Enter Mobile & OTP (1234) to claim ₹200 Starter Credit</div>
  <input id="ph" type="tel" maxlength="10" value="9876543210" placeholder="10-digit Mobile" />
  <input id="otp" type="tel" maxlength="4" value="1234" placeholder="OTP (1234)" />
  <button class="btn" onclick="enterApp()">Enter Arena</button>
</div>

<div id="appBox" class="hide">
  <div class="card">
    <div class="row">
      <div><strong>PulsePlay Hub</strong><div id="uid" style="font-size:11px;color:#94a3b8"></div></div>
      <div><div class="bal" id="bal">₹200.00</div><div id="wg" style="font-size:11px;color:#94a3b8">Wagered: ₹0 / ₹600</div></div>
    </div>
    <div class="stakes">
      <button class="st" onclick="setBet(10,this)">₹10</button>
      <button class="st on" onclick="setBet(20,this)">₹20</button>
      <button class="st" onclick="setBet(50,this)">₹50</button>
      <button class="st" onclick="setBet(100,this)">₹100</button>
    </div>
    <div class="tabs">
      <button class="tab on" onclick="showTab('sky',this)">🚀 Sky wins</button>
      <button class="tab" onclick="showTab('mine',this)">💎 Crystal</button>
      <button class="tab" onclick="showTab('hue',this)">🎨 Hue</button>
      <button class="tab" onclick="showTab('spin',this)">🎡 Spin</button>
    </div>

    <!-- 1. SKY WINS -->
    <div id="g-sky">
      <div class="sky"><div class="mult" id="mTxt">1.00×</div><div id="sTxt" style="font-size:12px;color:#94a3b8">Launch & Cash Out before crash!</div></div>
      <button class="btn" id="skyBtn" onclick="toggleSky()">Launch Flight (₹20)</button>
    </div>

    <!-- 2. CRYSTAL DROP -->
    <div id="g-mine" class="hide">
      <div class="row" style="font-size:13px"><span>Gems: <b id="gCnt">0</b></span><span>Win: <b id="mWin" style="color:#facc15">₹0</b></span></div>
      <div class="grid" id="board"></div>
      <button class="btn" id="mineBtn" onclick="toggleMine()">Start Crystal Round (₹20)</button>
    </div>

    <!-- 3. HUE MATCH -->
    <div id="g-hue" class="hide">
      <div class="hue">
        <button class="hb on" style="background:#059669" onclick="pickH('Green',this)">Green (2×)</button>
        <button class="hb" style="background:#7c3aed" onclick="pickH('Violet',this)">Violet (4×)</button>
        <button class="hb" style="background:#dc2626" onclick="pickH('Red',this)">Red (2×)</button>
      </div>
      <button class="btn" onclick="playHue()">Draw Hue Round (₹20)</button>
    </div>

    <!-- 4. SPIN BLITZ -->
    <div id="g-spin" class="hide">
      <div class="sky"><div class="mult" id="spTxt">🎡 0× – 5×</div><div style="font-size:12px;color:#94a3b8">Multipliers: 0×, 0.5×, 1.5×, 2×, 3×, 5×</div></div>
      <button class="btn" onclick="playSpin()">Spin Wheel (₹20)</button>
    </div>

    <div class="box" id="msg">Ready to play! Select any game above.</div>
    <button class="btn blue" onclick="showUpi()">UPI Deposit Info (sashu1537@ybl)</button>
  </div>
</div>

<script>
let bal=200,wag=0,bet=20,skyOn=false,skyM=1,skyCrash=2,skyT=null,mineOn=false,bombs=[],gems=0,huePick='Green';
const $=id=>document.getElementById(id);
function upd(){
  $('bal').textContent='₹'+bal.toFixed(2);
  $('wg').textContent='Wagered: ₹'+wag+' / ₹600';
  if(!skyOn)$('skyBtn').textContent='Launch Flight (₹'+bet+')';
  if(!mineOn)$('mineBtn').textContent='Start Crystal Round (₹'+bet+')';
}
function enterApp(){
  if($('ph').value.length<10||$('otp').value.length<4)return alert('Enter mobile & 4-digit OTP');
  $('uid').textContent='ID: +91 '+$('ph').value;
  $('loginBox').classList.add('hide');$('appBox').classList.remove('hide');upd();
}
function setBet(v,el){
  if(skyOn||mineOn)return;
  bet=v;document.querySelectorAll('.st').forEach(b=>b.classList.remove('on'));el.classList.add('on');upd();
}
function showTab(t,el){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));el.classList.add('on');
  ['sky','mine','hue','spin'].forEach(x=>$('g-'+x).classList.toggle('hide',x!==t));
}
function toggleSky(){
  if(!skyOn){
    if(bal<bet)return $('msg').textContent='Low balance!';
    bal-=bet;wag+=bet;skyOn=true;skyM=1;skyCrash=+(1.15+Math.random()*3.8).toFixed(2);
    $('skyBtn').className='btn red';$('sTxt').textContent='Flying... Tap Cash Out!';upd();
    skyT=setInterval(()=>{
      skyM=+(skyM+0.06).toFixed(2);$('mTxt').textContent=skyM.toFixed(2)+'×';
      $('skyBtn').textContent='Cash Out ₹'+(bet*skyM).toFixed(2);
      if(skyM>=skyCrash){
        clearInterval(skyT);skyOn=false;$('skyBtn').className='btn';
        $('mTxt').textContent='Crashed @ '+skyCrash+'×';$('msg').textContent='Sky wins: Flew away! Lost ₹'+bet;upd();
      }
    },130);
  }else{
    clearInterval(skyT);skyOn=false;const w=+(bet*skyM).toFixed(2);bal+=w;
    $('skyBtn').className='btn';$('msg').textContent='Sky wins: Cashed out at '+skyM+'× — Won ₹'+w+'!';upd();
  }
}
function drawBoard(show){
  const b=$('board');b.innerHTML='';
  for(let i=0;i<25;i++){
    const c=document.createElement('button');c.className='cell';
    c.textContent=show?(bombs.includes(i)?'💣':'💎'):'?';
    c.onclick=()=>{
      if(!mineOn||c.dataset.open)return;c.dataset.open=1;
      if(bombs.includes(i)){mineOn=false;drawBoard(true);$('mineBtn').className='btn';$('msg').textContent='Crystal Drop: Hit Mine!';upd();}
      else{c.textContent='💎';gems++;const w=+(bet*(1+gems*0.35)).toFixed(2);$('gCnt').textContent=gems;$('mWin').textContent='₹'+w;$('mineBtn').textContent='Cash Out ₹'+w;}
    };b.appendChild(c);
  }
}
drawBoard(false);
function toggleMine(){
  if(!mineOn){
    if(bal<bet)return $('msg').textContent='Low balance!';
    bal-=bet;wag+=bet;mineOn=true;gems=0;bombs=[];
    while(bombs.length<3){let r=Math.floor(Math.random()*25);if(!bombs.includes(r))bombs.push(r);}
    $('gCnt').textContent=0;$('mWin').textContent='₹'+bet;$('mineBtn').className='btn red';$('mineBtn').textContent='Pick Tile or Cash Out';
    drawBoard(false);upd();
  }else if(gems>0){
    const w=+(bet*(1+gems*0.35)).toFixed(2);bal+=w;mineOn=false;drawBoard(true);
    $('mineBtn').className='btn';$('msg').textContent='Crystal Drop: Won ₹'+w+'!';upd();
  }
}
function pickH(c,el){huePick=c;document.querySelectorAll('.hb').forEach(b=>b.classList.remove('on'));el.classList.add('on');}
function playHue(){
  if(bal<bet)return $('msg').textContent='Low balance!';
  bal-=bet;wag+=bet;const cols=['Green','Green','Red','Red','Violet'];
  const res=cols[Math.floor(Math.random()*cols.length)];
  const mult=res==='Violet'?4:2;
  if(res===huePick){const w=bet*mult;bal+=w;$('msg').textContent='Hue Match: '+res+' hit! Won ₹'+w;}
  else $('msg').textContent='Hue Match: Result was '+res+'. No win.';upd();
}
function playSpin(){
  if(bal<bet)return $('msg').textContent='Low balance!';
  bal-=bet;wag+=bet;const arr=[0,0.5,1.5,2,3,5,0,1.5];
  const m=arr[Math.floor(Math.random()*arr.length)];const w=+(bet*m).toFixed(2);bal+=w;
  $('spTxt').textContent='🎡 '+m+'×';$('msg').textContent=w>0?'Spin Blitz: Landed '+m+'× — Won ₹'+w+'!':'Spin Blitz: Landed 0×.';upd();
}
function showUpi(){
  $('msg').innerHTML='UPI ID: <b>sashu1537@ybl</b><br>Ref: <b>PulsePlay-Desk-01</b><br>QR: <a style="color:#60a5fa" target="_blank" href="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=upi%3A%2F%2Fpay%3Fpa%3Dsashu1537%40ybl%26pn%3DPulsePlay%2520Hub%26tn%3DPulsePlay-Desk-01">Open UPI QR Code</a>';
}
</script>
</body>
</html>
